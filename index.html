<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Költsd el Mészáros Lőrinc vagyonát!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #1e3c72;
            color: white;
            padding: 25px 10px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        h1 { margin: 0 0 5px 0; font-size: 1.8em; }
        .usd-subtitle { font-size: 0.9em; opacity: 0.85; margin-bottom: 12px; }
        .balance {
            font-size: 2.2em;
            font-weight: bold;
            color: #2ecc71;
            background: rgba(0,0,0,0.25);
            padding: 8px 20px;
            border-radius: 8px;
            display: inline-block;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .icon { font-size: 3em; margin-bottom: 10px; }
        .title { font-size: 1.1em; font-weight: bold; margin-bottom: 5px; }
        .price { color: #e74c3c; font-weight: bold; margin-bottom: 15px; }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        button {
            padding: 8px 16px;
            font-size: 1em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.1s;
            user-select: none;
        }
        .buy { background-color: #2ecc71; color: white; }
        .buy:hover { background-color: #27ae60; }
        .sell { background-color: #e74c3c; color: white; }
        .sell:hover { background-color: #c0392b; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        .count-input {
            font-size: 1.1em;
            font-weight: bold;
            width: 60px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 6px 0;
        }
        .count-input::-webkit-inner-spin-button, 
        .count-input::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        
        .receipt-container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            text-align: center;
        }
        .receipt-container h2 {
            margin-top: 0;
            color: #1e3c72;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .receipt-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            text-align: left;
        }
        .receipt-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #ddd;
        }
        .receipt-total {
            font-weight: bold;
            font-size: 1.2em;
            margin-top: 15px;
            color: #e74c3c;
        }
        .reset-btn {
            background-color: #7f8c8d;
            color: white;
            margin-top: 15px;
        }
        .reset-btn:hover { background-color: #95a5a6; }
    </style>
</head>
<body>

<header>
    <h1>Költsd el Mészáros Lőrinc vagyonát!</h1>
    <div class="usd-subtitle">Teljes keret: ~5,2 Milliárd USD (1 950 000 000 000 Ft)</div>
    <div class="balance" id="balance">1 950 000 000 000 Ft</div>
</header>

<div class="grid" id="items-grid"></div>

<div class="receipt-container" id="receipt-container" style="display: none;">
    <h2>🧾 Bevásárlólista / Számla</h2>
    <ul class="receipt-list" id="receipt-list"></ul>
    <div class="receipt-total" id="receipt-total"></div>
    <button class="reset-btn" onclick="resetAll()">Mindent alaphelyzetbe</button>
</div>

<script>
    const INITIAL_MONEY = 1950000000000;
    let totalMoney = INITIAL_MONEY;

    const items = [
        { name: "Szupermarketes K kifli", price: 80, icon: "🥐", count: 0 },
        { name: "Lángos a Balatonon", price: 2000, icon: "🥖", count: 0 },
        { name: "Gázszerelő óradíj", price: 25000, icon: "🔧", count: 0 },
        { name: "1 Éves BKK bérlet", price: 108000, icon: "🚌", count: 0 },
        { name: "IPhone 16 Pro Max", price: 600000, icon: "📱", count: 0 },
        { name: "Pancho Aréna gyepszőnyeg (m²)", price: 15000, icon: "⚽", count: 0 },
        { name: "Luxus lakás Budapesten", price: 150000000, icon: "🏢", count: 0 },
        { name: "Kisvasút szerelvény", price: 800000000, icon: "🚂", count: 0 },
        { name: "Balatoni szuperyacht", price: 18000000000, icon: "🛥️", count: 0 },
        { name: "Autópálya koncesszió (1 év)", price: 50000000000, icon: "🛣️", count: 0 }
    ];

    let holdTimeout, holdInterval;

    function formatMoney(amount) {
        return amount.toLocaleString('hu-HU') + " Ft";
    }

    function renderItems() {
        const grid = document.getElementById('items-grid');
        grid.innerHTML = '';

        items.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="icon">${item.icon}</div>
                <div class="title">${item.name}</div>
                <div class="price">${formatMoney(item.price)}</div>
                <div class="controls">
                    <button class="sell" 
                        id="sell-${index}"
                        onmousedown="startHold('sell', ${index})" 
                        onmouseup="stopHold()" 
                        onmouseleave="stopHold()"
                        ontouchstart="startHold('sell', ${index})" 
                        ontouchend="stopHold()"
                        ${item.count === 0 ? 'disabled' : ''}>Elad</button>
                    
                    <input type="number" class="count-input" value="${item.count}" min="0" onchange="changeInput(${index}, this.value)">
                    
                    <button class="buy" 
                        id="buy-${index}"
                        onmousedown="startHold('buy', ${index})" 
                        onmouseup="stopHold()" 
                        onmouseleave="stopHold()"
                        ontouchstart="startHold('buy', ${index})" 
                        ontouchend="stopHold()"
                        ${totalMoney < item.price ? 'disabled' : ''}>Vesz</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function renderReceipt() {
        const receiptContainer = document.getElementById('receipt-container');
        const receiptList = document.getElementById('receipt-list');
        const receiptTotal = document.getElementById('receipt-total');

        const purchasedItems = items.filter(item => item.count > 0);

        if (purchasedItems.length === 0) {
            receiptContainer.style.display = 'none';
            return;
        }

        receiptContainer.style.display = 'block';
        receiptList.innerHTML = '';

        let totalSpent = 0;
        purchasedItems.forEach(item => {
            const itemTotal = item.price * item.count;
            totalSpent += itemTotal;
            const li = document.createElement('li');
            li.className = 'receipt-item';
            li.innerHTML = `
                <span>${item.icon} ${item.name} × ${item.count}</span>
                <span><b>${formatMoney(itemTotal)}</b></span>
            `;
            receiptList.appendChild(li);
        });

        receiptTotal.innerHTML = `Összesen elköltve: ${formatMoney(totalSpent)}`;
    }

    function buyItem(index) {
        if (totalMoney >= items[index].price) {
            totalMoney -= items[index].price;
            items[index].count++;
            update();
            return true;
        }
        stopHold();
        return false;
    }

    function sellItem(index) {
        if (items[index].count > 0) {
            totalMoney += items[index].price;
            items[index].count--;
            update();
            return true;
        }
        stopHold();
        return false;
    }

    function changeInput(index, value) {
        let newCount = parseInt(value) || 0;
        if (newCount < 0) newCount = 0;

        const currentCount = items[index].count;
        const diff = newCount - currentCount;
        const totalCost = diff * items[index].price;

        if (diff > 0) {
            if (totalMoney >= totalCost) {
                totalMoney -= totalCost;
                items[index].count = newCount;
            } else {
                const maxBuyable = Math.floor(totalMoney / items[index].price);
                items[index].count += maxBuyable;
                totalMoney -= maxBuyable * items[index].price;
            }
        } else if (diff < 0) {
            totalMoney += Math.abs(diff) * items[index].price;
            items[index].count = newCount;
        }

        update();
    }

    function startHold(action, index) {
        const actionFunc = action === 'buy' ? () => buyItem(index) : () => sellItem(index);
        
        if (actionFunc()) {
            holdTimeout = setTimeout(() => {
                holdInterval = setInterval(() => {
                    if (!actionFunc()) stopHold();
                }, 50);
            }, 300);
        }
    }

    function stopHold() {
        clearTimeout(holdTimeout);
        clearInterval(holdInterval);
    }

    function resetAll() {
        stopHold();
        totalMoney = INITIAL_MONEY;
        items.forEach(item => item.count = 0);
        update();
    }

    function update() {
        document.getElementById('balance').innerText = formatMoney(totalMoney);
        renderItems();
        renderReceipt();
    }

    renderItems();
</script>

</body>
</html>
