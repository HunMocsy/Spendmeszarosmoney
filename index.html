<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Költsd el Mészáros Lőrinc vagyonát!</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #1e3c72;
            color: white;
            padding: 20px 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .lang-selector {
            position: absolute;
            top: 15px;
            right: 15px;
        }
        .lang-selector select {
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            background: white;
            color: #1e3c72;
            font-size: 0.9em;
            outline: none;
        }
        h1 { 
            margin: 10px 0 5px 0; 
            font-size: 1.8em; 
        }
        .usd-subtitle { 
            font-size: 0.9em; 
            opacity: 0.85; 
            margin-bottom: 12px; 
        }
        .balance {
            font-size: 2em;
            font-weight: bold;
            color: #2ecc71;
            background: rgba(0,0,0,0.25);
            padding: 8px 20px;
            border-radius: 8px;
            display: inline-block;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .img-container {
            width: 100%;
            height: 160px;
            margin-bottom: 12px;
            border-radius: 8px;
            overflow: hidden;
            background-color: #eee;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .title { 
            font-size: 1.1em; 
            font-weight: bold; 
            margin-bottom: 5px; 
            min-height: 44px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .price { 
            color: #e74c3c; 
            font-weight: bold; 
            margin-bottom: 15px; 
            font-size: 1.05em;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        button {
            padding: 8px 16px;
            font-size: 1em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.1s;
            user-select: none;
            -webkit-user-select: none;
        }
        .buy { background-color: #2ecc71; color: white; }
        .buy:hover { background-color: #27ae60; }
        .sell { background-color: #e74c3c; color: white; }
        .sell:hover { background-color: #c0392b; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        .count-input {
            font-size: 1.1em;
            font-weight: bold;
            width: 65px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 6px 0;
            outline: none;
        }
        .count-input::-webkit-inner-spin-button, 
        .count-input::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        
        .receipt-container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            text-align: center;
        }
        .receipt-container h2 {
            margin-top: 0;
            color: #1e3c72;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .receipt-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            text-align: left;
        }
        .receipt-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #ddd;
        }
        .receipt-total {
            font-weight: bold;
            font-size: 1.2em;
            margin-top: 15px;
            color: #e74c3c;
        }
        .reset-btn {
            background-color: #7f8c8d;
            color: white;
            margin-top: 15px;
        }
        .reset-btn:hover { background-color: #95a5a6; }

        @media (max-width: 600px) {
            .lang-selector {
                position: relative;
                top: 0;
                right: 0;
                margin-bottom: 10px;
            }
            h1 { font-size: 1.4em; }
            .balance { font-size: 1.5em; }
        }
    </style>
</head>
<body>

<header>
    <div class="lang-selector">
        <select id="languageSelect" onchange="changeLanguage(this.value)">
            <option value="hu">🇭🇺 Magyar</option>
            <option value="en">🇬🇧 English</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="es">🇪🇸 Español</option>
            <option value="it">🇮🇹 Italiano</option>
            <option value="de">🇩🇪 Deutsch</option>
        </select>
    </div>
    <h1 id="page-title">Költsd el Mészáros Lőrinc vagyonát!</h1>
    <div class="usd-subtitle" id="page-subtitle">Teljes keret: ~5,2 Milliárd USD (1 950 000 000 000 Ft)</div>
    <div class="balance" id="balance">1 950 000 000 000 Ft</div>
</header>

<div class="grid" id="items-grid"></div>

<div class="receipt-container" id="receipt-container" style="display: none;">
    <h2 id="receipt-title">🧾 Bevásárlólista / Számla</h2>
    <ul class="receipt-list" id="receipt-list"></ul>
    <div class="receipt-total" id="receipt-total"></div>
    <button class="reset-btn" id="reset-btn" onclick="resetAll()">Mindent alaphelyzetbe</button>
</div>

<script>
    const INITIAL_MONEY = 1950000000000;
    let totalMoney = INITIAL_MONEY;
    let currentLang = 'hu';

    const translations = {
        hu: {
            title: "Költsd el Mészáros Lőrinc vagyonát!",
            subtitle: "Teljes keret: ~5,2 Milliárd USD (1 950 000 000 000 Ft)",
            buy: "Vesz",
            sell: "Elad",
            receiptTitle: "🧾 Bevásárlólista / Számla",
            totalSpent: "Összesen elköltve: ",
            resetBtn: "Mindent alaphelyzetbe"
        },
        en: {
            title: "Spend Lőrinc Mészáros's Money!",
            subtitle: "Total Net Worth: ~5.2 Billion USD (1,950,000,000,000 HUF)",
            buy: "Buy",
            sell: "Sell",
            receiptTitle: "🧾 Shopping Receipt",
            totalSpent: "Total Spent: ",
            resetBtn: "Reset All"
        },
        fr: {
            title: "Dépensez la fortune de Lőrinc Mészáros !",
            subtitle: "Fortune totale : ~5,2 Milliards USD (1 950 000 000 000 HUF)",
            buy: "Acheter",
            sell: "Vendre",
            receiptTitle: "🧾 Reçu d'achat",
            totalSpent: "Total dépensé : ",
            resetBtn: "Tout réinitialiser"
        },
        es: {
            title: "¡Gasta el dinero de Lőrinc Mészáros!",
            subtitle: "Patrimonio total: ~5,2 Mil Millones USD (1.950.000.000.000 HUF)",
            buy: "Comprar",
            sell: "Vender",
            receiptTitle: "🧾 Recibo de Compra",
            totalSpent: "Total Gastado: ",
            resetBtn: "Restablecer Todo"
        },
        it: {
            title: "Spendi i soldi di Lőrinc Mészáros!",
            subtitle: "Patrimonio totale: ~5,2 Miliardi di USD (1.950.000.000.000 HUF)",
            buy: "Acquista",
            sell: "Vendi",
            receiptTitle: "🧾 Scontrino",
            totalSpent: "Totale Speso: ",
            resetBtn: "Ripristina Tutto"
        },
        de: {
            title: "Gib das Geld von Lőrinc Mészáros aus!",
            subtitle: "Gesamtvermögen: ~5,2 Milliarden USD (1.950.000.000.000 HUF)",
            buy: "Kaufen",
            sell: "Verkaufen",
            receiptTitle: "🧾 Einkaufszettel / Quittung",
            totalSpent: "Insgesamt ausgegeben: ",
            resetBtn: "Alles zurücksetzen"
        }
    };

    const items = [
        { 
            price: 80, 
            image: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=400&auto=format&fit=crop&q=80", 
            count: 0,
            name: { hu: "Szupermarketes K kifli", en: "Supermarket Croissant", fr: "Croissant de supermarché", es: "Cruasán de Supermercado", it: "Cornetto del Supermercato", de: "Supermarkt-Hörnchen" }
        },
        { 
            price: 2000, 
            image: "https://likebalaton.hu/wp-content/uploads/2019/06/sajtos-tejfolos-langos-balaton.jpg", 
            count: 0,
            name: { hu: "Balatoni Lángos", en: "Lake Balaton Lángos", fr: "Lángos du lac Balaton", es: "Lángos del Lago Balatón", it: "Lángos del Lago Balaton", de: "Plattensee Lángos" }
        },
        { 
            price: 25000, 
            image: "https://images.unsplash.com/photo-1581244277943-fe4a9c777189?w=400&auto=format&fit=crop&q=80", 
            count: 0,
            name: { hu: "Gázszerelő óradíj", en: "Plumber Hourly Rate", fr: "Tarif horaire du plombier", es: "Tarifa por hora de Fontanero", it: "Tariffa oraria Idraulico", de: "Stundensatz Klempner" }
        },
        { 
            price: 108000, 
            image: "https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=400&auto=format&fit=crop&q=80", 
            count: 0,
            name: { hu: "1 Éves BKK bérlet", en: "1-Year Transit Pass", fr: "Abonnement de transport (1 an)", es: "Abono Anual de Transporte", it: "Abbonamento Annuale Bus", de: "1-Jahres-ÖPNV-Ticket" }
        },
        { 
            price: 600000, 
            image: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=400&auto=format&fit=crop&q=80", 
            count: 0,
            name: { hu: "iPhone 16 Pro Max", en: "iPhone 16 Pro Max", fr: "iPhone 16 Pro Max", es: "iPhone 16 Pro Max", it: "iPhone 16 Pro Max", de: "iPhone 16 Pro Max" }
        },
        { 
            price: 15000, 
            image: "https://images.unsplash.com/photo-1529900748604-07564a03e7a6?w=400&auto=format&fit=crop&q=80", 
            count: 0,
            name: { hu: "Pancho Aréna gyepszőnyeg (m²)", en: "Stadium Turf (m²)", fr: "Pelouse de stade (m²)", es: "Césped de Estadio (m²)", it: "Erba da Stadio (m²)", de: "Stadionrasen (m²)" }
        },
        { 
            price: 150000000, 
            image: "https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?w=400&auto=format&fit=crop&q=80", 
            count: 0,
            name: { hu: "Luxus lakás Budapesten", en: "Luxury Apartment in Bp", fr: "Appartement de luxe à Bp", es: "Apartamento de Lujo", it: "Appartamento di Lusso", de: "Luxuswohnung Budapest" }
        },
        { 
            price: 800000000, 
            image: "https://images.unsplash.com/photo-1474487548417-781cb71495f3?w=400&auto=format&fit=crop&q=80", 
            count: 0,
            name: { hu: "Kisvasút szerelvény", en: "Narrow-gauge Train", fr: "Train à voie étroite", es: "Tren de Vía Estrecha", it: "Treno a Scartamento Ridotto", de: "Schmalspurbahn-Zug" }
        },
        { 
            price: 18000000000, 
            image: "https://kep.cdn.indexvas.hu/1/0/1985/19857/198573/19857367_80ff5bffe0beda9d134343dec5c5d50d_wm.jpg", 
            count: 0,
            name: { hu: "Lady AMR szuperyacht", en: "Lady AMR Superyacht", fr: "Superyacht Lady AMR", es: "Superyate Lady AMR", it: "Superyacht Lady AMR", de: "Lady AMR Superjacht" }
        },
        { 
            price: 50000000000, 
            image: "https://images.unsplash.com/photo-1519003722824-194d4455a60c?w=400&auto=format&fit=crop&q=80", 
            count: 0,
            name: { hu: "Autópálya koncesszió (1 év)", en: "Highway Concession (1 yr)", fr: "Concession d'autoroute (1 an)", es: "Concesión de Autopista (1 año)", it: "Concessione Autostradale (1 an)", de: "Autobahnkonzession (1 Jr)" }
        }
    ];

    let holdTimeout, holdInterval;

    function formatMoney(amount) {
        return amount.toLocaleString('hu-HU') + " Ft";
    }

    function changeLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        
        document.getElementById('page-title').innerText = t.title;
        document.getElementById('page-subtitle').innerText = t.subtitle;
        document.getElementById('receipt-title').innerText = t.receiptTitle;
        document.getElementById('reset-btn').innerText = t.resetBtn;
        
        update();
    }

    function renderItems() {
        const grid = document.getElementById('items-grid');
        grid.innerHTML = '';
        const t = translations[currentLang];

        items.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="img-container">
                    <img src="${item.image}" class="card-img" alt="${item.name[currentLang]}">
                </div>
                <div class="title">${item.name[currentLang]}</div>
                <div class="price">${formatMoney(item.price)}</div>
                <div class="controls">
                    <button class="sell" 
                        id="sell-${index}"
                        onmousedown="startHold('sell', ${index})" 
                        onmouseup="stopHold()" 
                        onmouseleave="stopHold()"
                        ontouchstart="startHold('sell', ${index})" 
                        ontouchend="stopHold()"
                        ${item.count === 0 ? 'disabled' : ''}>${t.sell}</button>
                    
                    <input type="number" class="count-input" value="${item.count}" min="0" onchange="changeInput(${index}, this.value)">
                    
                    <button class="buy" 
                        id="buy-${index}"
                        onmousedown="startHold('buy', ${index})" 
                        onmouseup="stopHold()" 
                        onmouseleave="stopHold()"
                        ontouchstart="startHold('buy', ${index})" 
                        ontouchend="stopHold()"
                        ${totalMoney < item.price ? 'disabled' : ''}>${t.buy}</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function renderReceipt() {
        const receiptContainer = document.getElementById('receipt-container');
        const receiptList = document.getElementById('receipt-list');
        const receiptTotal = document.getElementById('receipt-total');
        const t = translations[currentLang];

        const purchasedItems = items.filter(item => item.count > 0);

        if (purchasedItems.length === 0) {
            receiptContainer.style.display = 'none';
            return;
        }

        receiptContainer.style.display = 'block';
        receiptList.innerHTML = '';

        let totalSpent = 0;
        purchasedItems.forEach(item => {
            const itemTotal = item.price * item.count;
            totalSpent += itemTotal;
            const li = document.createElement('li');
            li.className = 'receipt-item';
            li.innerHTML = `
                <span>${item.name[currentLang]} × ${item.count}</span>
                <span><b>${formatMoney(itemTotal)}</b></span>
            `;
            receiptList.appendChild(li);
        });

        receiptTotal.innerHTML = `${t.totalSpent}${formatMoney(totalSpent)}`;
    }

    function buyItem(index) {
        if (totalMoney >= items[index].price) {
            totalMoney -= items[index].price;
            items[index].count++;
            update();
            return true;
        }
        stopHold();
        return false;
    }

    function sellItem(index) {
        if (items[index].count > 0) {
            totalMoney += items[index].price;
            items[index].count--;
            update();
            return true;
        }
        stopHold();
        return false;
    }

    function changeInput(index, value) {
        let newCount = parseInt(value) || 0;
        if (newCount < 0) newCount = 0;

        const currentCount = items[index].count;
        const diff = newCount - currentCount;
        const totalCost = diff * items[index].price;

        if (diff > 0) {
            if (totalMoney >= totalCost) {
                totalMoney -= totalCost;
                items[index].count = newCount;
            } else {
                const maxBuyable = Math.floor(totalMoney / items[index].price);
                items[index].count += maxBuyable;
                totalMoney -= maxBuyable * items[index].price;
            }
        } else if (diff < 0) {
            totalMoney += Math.abs(diff) * items[index].price;
            items[index].count = newCount;
        }

        update();
    }

    function startHold(action, index) {
        const actionFunc = action === 'buy' ? () => buyItem(index) : () => sellItem(index);
        
        if (actionFunc()) {
            holdTimeout = setTimeout(() => {
                holdInterval = setInterval(() => {
                    if (!actionFunc()) stopHold();
                }, 50);
            }, 300);
        }
    }

    function stopHold() {
        clearTimeout(holdTimeout);
        clearInterval(holdInterval);
    }

    function resetAll() {
        stopHold();
        totalMoney = INITIAL_MONEY;
        items.forEach(item => item.count = 0);
        update();
    }

    function update() {
        document.getElementById('balance').innerText = formatMoney(totalMoney);
        renderItems();
        renderReceipt();
    }

    renderItems();
</script>

</body>
</html>
